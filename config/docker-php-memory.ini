; The image shipped no php.ini at all, so CLI PHP ran on the compiled-in
; 128M default. Under Xdebug coverage the suite died two thirds of the way
; through (TileCatalogService, allocating a catalog), and `make test` could
; not complete locally at all — the workaround being -d memory_limit=-1 on
; every invocation.
;
; 512M covers the suite with coverage and leaves headroom; it is not a
; licence to allocate. Apache/FPM inherit it too, which is fine: a request
; that needs more than this is a bug worth seeing.
memory_limit = 512M

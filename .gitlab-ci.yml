variables:
  # Branch auto-deployed to the experimental environment.
  # - value:       default used by automatic pipelines.
  # - description: makes the field prefilled + editable in the "Run pipeline"
  #                form, so you can pick the branch when launching manually.
  # Can also be overridden permanently via a project CI/CD variable
  # (Settings > CI/CD > Variables) — no code change needed either way.
  EXPERIMENTAL_BRANCH:
    value: "saison-3"
    description: "Branch deployed to the experimental environment (set this to the branch you are running the pipeline on)."
  # Tag VERSIONNÉ de l'image de test — à bumper dans le même commit qu'un
  # changement de Dockerfile.test. Avec la pull policy if-not-present du
  # runner, un tag mutable (latest) resservait indéfiniment sa copie locale
  # périmée ; un tag neuf n'existe pas localement, donc il est tiré une fois,
  # puis plus jamais — zéro pull en régime permanent, zéro image périmée.
  TEST_IMAGE_TAG: "test-20260726"

# stan_job et test_job partagent l'étape test : ils ne dépendent que de
# l'image, pas l'un de l'autre — les sérialiser doublait la durée du pipeline.
stages:
  - build
  - test
  - security
  - prepare
  - release
  - deployment

# TEMPLATE
# https://docs.gitlab.com/ee/ci/yaml/#yaml-anchors-and-aliases
# https://docs.gitlab.com/ci/yaml/yaml_optimization/#yaml-anchors-for-scripts
.php-job-template: &php-job-template
  cache: &cache-template
    key:
      files:
        - composer.lock
    paths:
      - vendor/
  image: $CI_REGISTRY_IMAGE/test:$TEST_IMAGE_TAG

build_image:
  stage: build
  services:
    - name: docker:dind
  image: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    IMAGE_TAG: "test:$TEST_IMAGE_TAG"
    # Enable BuildKit so --build-arg BUILDKIT_INLINE_CACHE works and
    # --cache-from picks up unchanged layers from the previous image.
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - export DOCKER_IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_TAG"
    # Pull the previous image (if any) so its layers are available as
    # build cache. The "|| true" handles the bootstrap case where the
    # registry has nothing yet. Le tag étant versionné, un tag neuf se
    # rabat sur test:latest (dernière image de l'ère tag-mutable) pour
    # ne pas repartir de zéro.
    - docker pull $DOCKER_IMAGE 2>/dev/null || docker pull $CI_REGISTRY_IMAGE/test:latest 2>/dev/null || true
    - |
      build_with_cache() {
        docker build \
          --cache-from $DOCKER_IMAGE \
          --cache-from $CI_REGISTRY_IMAGE/test:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t $DOCKER_IMAGE \
          -f Dockerfile.test \
          .
        docker push $DOCKER_IMAGE
      }
      if ! docker manifest inspect $DOCKER_IMAGE >/dev/null 2>&1; then
        echo "Image does not exist, building (no cache available)..."
        build_with_cache
      elif [ "$FORCE_REBUILD" = "true" ]; then
        echo "Changes detected. Rebuilding (with --cache-from $DOCKER_IMAGE)..."
        build_with_cache
      else
        echo "Image $DOCKER_IMAGE already exists, skipping build."
      fi
  rules:
    # L'image ne contient que l'environnement (PHP, extensions, outils) — le
    # code est cloné par chaque job, jamais cuit dans l'image. Un push de code
    # n'a donc rien à reconstruire : le job ne s'attache que si la recette de
    # l'image ou la config du pipeline change. L'ancien repli `exists:
    # Dockerfile.test` attachait le job (et sa minute de rituel dind) à chaque
    # pipeline pour conclure « rien à faire ». Déclenchement web gardé pour
    # amorcer un registre vide. NB : le premier pipeline d'une branche neuve
    # compte tout comme « changé » (comportement GitLab) — rebuild assisté par
    # cache dans ce cas, ~1 min quand les couches se retrouvent.
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        paths:
          - Dockerfile.test
          - .gitlab-ci.yml
      variables:
        FORCE_REBUILD: "true"
    - if: '$CI_PIPELINE_SOURCE == "web"'

stan_job:
  <<: *php-job-template
  stage: test
  # Double cache : vendor (clé composer.lock, comme le template) + le cache de
  # résultats PHPStan (phpstan.neon → tmpDir: tmp/phpstan) pour ne réanalyser
  # que les fichiers modifiés d'un pipeline à l'autre.
  cache:
    - *cache-template
    - key: phpstan-result-cache
      paths:
        - tmp/phpstan/
  script:
    - make phpstan-ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH

# The PHPUnit suite needs a reachable DB: without one, config/functions.php
# db() used to kill the run with exit code 0 and the job stayed green while
# ZERO tests executed. Same throwaway mariadb + seeding as cypress_tutorial_job.
test_job:
  <<: *php-job-template
  stage: test
  services:
    - name: mariadb:11
      alias: mariadb
      variables:
        MARIADB_ROOT_PASSWORD: passwordRoot
        MARIADB_DATABASE: aoo4
  variables:
    DB_HOST: mariadb
    DB_USER: root
    DB_PASS: passwordRoot
    # Surchargée par les règles ci-dessous sur les branches d'intégration.
    TEST_TARGET: test-ci
  before_script:
    - make setup-ci-env
    - composer install --no-progress --no-interaction
    - bash scripts/testing/setup_ci_database.sh
  script:
    - make $TEST_TARGET
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    reports:
      junit: phpunit-report.xml
      coverage_report:
        coverage_format: cobertura
        path: tmp/coverage/cobertura.xml
  # Les branches de travail passent la suite SANS couverture : c'est le
  # retour rapide. La couverture, sept fois plus chère en calcul, n'est
  # mesurée que là où on la lit — les branches d'intégration.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "saison-3" || $CI_COMMIT_BRANCH == "integration/hud-redesign"
      variables:
        TEST_TARGET: test-ci-coverage
    - if: $CI_COMMIT_BRANCH

# Cypress tutorial E2E test. Manual trigger initially: confirm Dockerfile.test
# has node + npx + xvfb + the electron browser before flipping to automatic.
# Once green for ~3 runs, drop `when: manual` and `allow_failure: true`.
#
# Rules: only attach the job to the long-lived branches where we'd actually
# trigger it (tutorial-refactoring, staging, saison-3, main). Including
# `- when: manual` as a fallback would make the job appear on every feature
# branch's pipeline as a manual-only job, which produces a "skipped"
# pipeline status that the project's merge policy then refuses to accept.
cypress_tutorial_job:
  <<: *php-job-template
  stage: test
  services:
    - name: mariadb:11
      alias: mariadb
      variables:
        MARIADB_ROOT_PASSWORD: passwordRoot
        MARIADB_DATABASE: aoo4
  variables:
    DB_HOST: mariadb
    DB_USER: root
    DB_PASS: passwordRoot
    # cypress.config.js reads TEST_DB_* (same contract as
    # scripts/testing/reset_test_database.sh). Without these aliases the
    # cy.task('queryDatabase') defaults kick in and try to reach the
    # devcontainer host `mariadb-aoo4`, which doesn't exist in CI.
    TEST_DB_HOST: mariadb
    TEST_DB_USER: root
    TEST_DB_PASS: passwordRoot
    TEST_DB_NAME: aoo4
    CYPRESS_CONTAINER: "true"
    # Cypress flows need the tutorial force-enabled; test_job must not set it
    # (TutorialFeatureFlagTest exercises the disabled paths).
    ENABLE_TUTORIAL_V2: "1"
  before_script:
    # Stage the data + image fixtures the app expects.
    - make setup-ci-env
    - composer install --no-progress --no-interaction
    - npm ci --no-audit --no-fund
  script:
    # Write the CI db config + seed the mariadb service (schema, migration
    # tracking, tutorial_* migrations). See the script for the why.
    - bash scripts/testing/setup_ci_database.sh
    # Sanity probe the data fixtures the Cypress spec depends on. If
    # `make setup-ci-env` failed silently this surfaces it before the
    # spec hits the API.
    - ls datas/public/races/ | head -5
    # Serve the app to Cypress in the background. The base image is the
    # PHP CLI (no Apache); php -S is the simplest way to expose the app
    # at http://localhost which is what cypress.config.js targets when
    # CYPRESS_CONTAINER=true.
    - php -S 0.0.0.0:80 -t . > /tmp/php-server.log 2>&1 &
    - sleep 2
    - make cypress-tutorial-ci
  after_script:
    # Surface the PHP server log alongside Cypress output even on failure.
    - cat /tmp/php-server.log 2>/dev/null || true
  artifacts:
    when: always
    reports:
      junit: cypress-report.xml
    paths:
      - cypress/screenshots/
      - cypress/videos/
      - data_tests/cypress/screenshots/
      - data_tests/cypress/videos/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # staging: manual + allow_failure while the 11x11-plan regression
    # is investigated. Flip back to auto-trigger once Cypress is green.
    - if: $CI_COMMIT_REF_NAME == "staging"
      when: manual
      allow_failure: true
    # tutorial-refactoring / experimental / main: manual trigger to
    # conserve CI minutes. allow_failure so this manual job stays OPTIONAL —
    # without it a non-triggered manual job blocks the test stage and the
    # deployment stage never runs (the experimental deploy got stuck behind it).
    # A human-triggered red is still a real signal.
    - if: $CI_COMMIT_REF_NAME == "tutorial-refactoring"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_REF_NAME == $EXPERIMENTAL_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_REF_NAME == "main"
      when: manual
      allow_failure: true

prepare_job:
  stage: prepare
  image: alpine:latest
  rules:
  - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
  script:
    - apk add bash git
    - ./scripts/generate-release-notes.sh > release_notes.md
  artifacts:
    paths:
    - release_notes.md

release-job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
  - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
  script:
    - echo "Creating release"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: 'Release $CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    description: release_notes.md

# Auto-deploy the non-prod environments now co-hosted on the single account:
#   staging               -> test subdomain
#   $EXPERIMENTAL_BRANCH   -> experimental subdomain (branch is configurable)
# prod (main) has no deploy job — it stays manual, and admin/deploy.php refuses
# the `ci` flag on the prod host anyway. The token travels in a header so it is
# not written to Apache access logs. env_branch tells deploy.php which branch to
# check out + deploy (honoured for non-prod only).
deploy-job-non-prod:
  stage: deployment
  image: alpine
  environment:
    name: $CI_COMMIT_REF_NAME
    url: https://${DEPLOY_HOST}
  before_script:
    - apk add curl
  script:
    # Single-quoted: the "X-Deploy-Token: ..." header contains a colon-space,
    # which would otherwise make YAML parse this line as a map, not a string.
    - 'curl ${CURL_OPTS} -X POST -H "X-Deploy-Token: ${DEPLOY_KEY_PASS}" "https://${DEPLOY_HOST}/admin/deploy.php?type=code&ci&env_branch=${CI_COMMIT_REF_NAME}"'
  rules:
    - if: $CI_COMMIT_REF_NAME == "staging" && $CI_MERGE_REQUEST_ID == null
      variables:
        DEPLOY_HOST: "test.age-of-olympia.net"
    - if: $CI_COMMIT_REF_NAME == $EXPERIMENTAL_BRANCH && $CI_MERGE_REQUEST_ID == null
      variables:
        DEPLOY_HOST: "experimental.age-of-olympia.net"
